<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logos</title>
<meta name="app-version" content="a1f916c430">
<meta name="theme-color" content="#4b6a8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf8f4;--sf:#fff;--tx:#222;--mu:#6b6b6b;--bd:#ddd6c8;--ac:#c9602b;--act:#fff;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#17120f;--sf:#241d18;--tx:#f1ebe4;--mu:#a89f94;--bd:#3d342c;--ac:#e0804a;--act:#17120f;color-scheme:dark}}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 40px;text-align:center}
.logo{width:132px;height:132px;border-radius:50%;box-shadow:0 6px 22px rgba(0,0,0,.25)}
h1{font-size:2.2rem;letter-spacing:.06em;margin:14px 0 2px}
.sub{color:var(--mu);margin:0 0 22px}
.langs{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(max-width:420px){.langs{grid-template-columns:1fr}}
.lang{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;text-decoration:none;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;font:inherit;cursor:pointer}
.lang b{font-size:1.1rem}.lang span{color:var(--mu);font-size:.95rem}
.lang:hover,.lang:focus-visible{border-color:var(--ac);outline:2px solid var(--ac);outline-offset:1px}
.lang.go{border-color:var(--ac)}
#soon{margin-top:16px;background:var(--sf);border:1px solid var(--ac);border-radius:12px;padding:10px 14px;text-align:left}
#soon[hidden]{display:none}
.mu{color:var(--mu);font-size:.9rem;margin-top:18px}
button{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer}
#upd{background:var(--ac);color:var(--act);border-radius:10px;padding:8px 12px;margin-bottom:16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
#upd[hidden],#inst[hidden]{display:none}#upd button{background:var(--act);color:var(--ac);border-color:var(--act);font-weight:700}
</style>
</head>
<body>
<main>
<div id="upd" hidden>🔄 A new version of the app is ready. <button type="button" id="updb">Update</button></div>
<img class="logo" src="icon-192.png" alt="Logos">
<h1>Logos</h1>
<p class="sub">Choose a language</p>
<div class="langs">
<a class="lang go" href="latin.html" data-k="1"><b>1. Latin</b><span>Lingua Latīna</span></a>
<button type="button" class="lang soon" data-k="2" data-n="Classical Greek"><b>2. Classical Greek</b><span>Ἑλληνική</span></button>
<button type="button" class="lang soon" data-k="3" data-n="German"><b>3. German</b><span>Deutsch</span></button>
<button type="button" class="lang soon" data-k="4" data-n="English"><b>4. English</b><span>English</span></button>
</div>
<div id="soon" role="status" hidden></div>
<p class="mu">More languages will come later. Press 1 to 4 to choose.</p>
<p><button type="button" id="inst" hidden>📲 Install app</button></p>
</main>
<script>
const $=s=>document.querySelector(s);
function soon(n){const e=$('#soon');e.textContent='🚧 '+n+' is under construction. Please check back soon.';e.hidden=false}
document.querySelectorAll('.soon').forEach(b=>b.addEventListener('click',()=>soon(b.dataset.n)));
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.altKey||e.metaKey)return;
  const el=document.querySelector('.lang[data-k="'+e.key+'"]');if(!el)return;
  if(el.tagName==='A')location.href=el.getAttribute('href');else soon(el.dataset.n);
});
const VER=(document.querySelector('meta[name="app-version"]')||{}).content;
async function chkUpd(){
  if(!/^https?:/.test(location.protocol)||!VER)return;
  try{const t=await(await fetch(location.pathname,{cache:'no-cache'})).text();const m=t.match(/<meta name="app-version" content="([^"]+)"/);if(m&&m[1]!==VER)$('#upd').hidden=false}catch(e){}
}
$('#updb').onclick=()=>location.reload();
if(/^https?:/.test(location.protocol)&&'serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  setTimeout(chkUpd,4000);setInterval(chkUpd,1800000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)chkUpd()});
}
let ip=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{if(!ip)return;ip.prompt();try{await ip.userChoice}catch(e){}ip=null;$('#inst').hidden=true};
window.addEventListener('appinstalled',()=>{$('#inst').hidden=true});
</script>
</body>
</html>
